<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="googlebot" content="noindex,nofollow">
<title>KnitSnap — Home Mockup</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card: #FFFFFF;
    --text-primary: #1C1C1E;
    --text-secondary: #8E8E93;
    --text-tertiary: #C7C7CC;
    --separator: #E5E5EA;
    --pink: #FF2D7A;
    --pink-soft: #FF6F9C;
    --orange: #FF8A4C;
    --yellow: #FFCC00;
    --purple: #AF52DE;
    --teal: #5AC8FA;
    --gray: #8E8E93;
    --brown: #A2845E;
    --link-blue: #007AFF;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }

  html, body {
    font-family: -apple-system, "SF Pro Text", "SF Pro Display", "Apple SD Gothic Neo", "Pretendard", sans-serif;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* iPhone 16 Pro frame: 393x852 CSS px */
  .device {
    width: 393px;
    height: 852px;
    background: var(--bg);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* Status bar */
  .status-bar {
    height: 54px;
    padding: 18px 28px 0 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 17px;
    font-weight: 600;
    color: var(--text-primary);
    flex-shrink: 0;
  }
  .status-right { display: flex; align-items: center; gap: 6px; }
  .signal { width: 18px; height: 12px; }
  .lte { font-size: 14px; font-weight: 600; }
  .battery {
    width: 26px; height: 12px;
    border: 1.5px solid var(--text-primary);
    border-radius: 3px;
    position: relative;
    padding: 1px;
  }
  .battery::after {
    content: '';
    position: absolute;
    right: -3px;
    top: 3px;
    width: 2px;
    height: 4px;
    background: var(--text-primary);
    border-radius: 0 1px 1px 0;
  }
  .battery .level {
    height: 100%;
    background: #34C759;
    border-radius: 1px;
    width: 100%;
  }
  .battery-pct { font-size: 9px; font-weight: 700; color: #fff; position: absolute; top: 1px; left: 4px; line-height: 8px; }

  /* Scrollable content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 0 16px 8px 16px;
  }

  /* Recent photos strip */
  .photos-strip {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 8px;
  }
  .photos-row {
    display: flex;
    gap: 2px;
    padding: 0;
  }
  .photo-cell {
    flex: 1;
    aspect-ratio: 1;
    background-size: cover;
    background-position: center;
    background-color: #d8d8d8;
    position: relative;
  }
  .photo-cell .label {
    position: absolute;
    top: 4px;
    left: 4px;
    color: white;
    font-size: 9px;
    line-height: 1.1;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
  }
  .view-all {
    text-align: center;
    padding: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    border-top: 0.5px solid var(--separator);
  }
  .view-all .chevron { color: var(--text-tertiary); margin-left: 4px; }

  /* Section header */
  .section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 18px 4px 8px 4px;
    font-size: 14px;
  }
  .section-header .title {
    font-weight: 600;
    color: var(--text-primary);
  }
  .section-header .count {
    font-size: 12px;
    color: var(--text-secondary);
  }
  .section-header .right-link {
    margin-left: auto;
    font-size: 14px;
    font-weight: 500;
    color: var(--link-blue);
  }
  .star-icon { color: var(--yellow); font-size: 12px; }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .status-dot.ongoing { background: var(--purple); }

  /* Card list */
  .card-list {
    background: var(--card);
    border-radius: 14px;
    overflow: hidden;
  }
  .row {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    font-size: 16px;
    color: var(--text-primary);
    border-bottom: 0.5px solid var(--separator);
    gap: 10px;
  }
  .row:last-child { border-bottom: none; }
  .row .chevron {
    margin-left: auto;
    color: var(--text-tertiary);
    font-size: 14px;
  }
  .row .row-icon {
    color: var(--pink);
    font-size: 18px;
  }
  .row .star-fav {
    color: var(--yellow);
    font-size: 13px;
  }
  .row .right-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-secondary);
  }
  .row .label-strong { font-weight: 600; }

  /* AdMob banner */
  .ad-banner {
    background: #1a1a1a;
    color: #fff;
    height: 50px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 13px;
    flex-shrink: 0;
    gap: 8px;
  }
  .ad-banner .ad-thumb {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #4285F4, #34A853);
    border-radius: 4px;
    flex-shrink: 0;
  }
  .ad-banner .ad-text { flex: 1; line-height: 1.3; font-size: 12px; }
  .ad-banner .test-pill {
    background: rgba(0,0,0,0.7);
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 11px;
    color: #fff;
    flex-shrink: 0;
  }
  .ad-banner .ad-logo {
    background: #fff;
    color: #FFC107;
    width: 24px; height: 24px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Tab bar */
  .tab-bar {
    height: 56px;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    border-top: 0.5px solid var(--separator);
    display: flex;
    padding: 6px 0;
    flex-shrink: 0;
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-secondary);
    font-size: 10px;
  }
  .tab.active { color: var(--pink); }
  .tab .icon { font-size: 22px; }

  /* SF Symbols approximated as unicode/emoji */
  .ic { font-family: -apple-system, sans-serif; font-style: normal; }
</style>
</head>
<body>
<div class="device">

  <!-- Status bar -->
  <div class="status-bar">
    <span>1:45</span>
    <span class="status-right">
      <svg class="signal" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="9" width="3" height="3" rx="0.5"/><rect x="5" y="6" width="3" height="6" rx="0.5"/><rect x="10" y="3" width="3" height="9" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
      <span class="lte">LTE</span>
      <span class="battery"><span class="level"></span><span class="battery-pct">100</span></span>
    </span>
  </div>

  <!-- Scrollable content -->
  <div class="content">

    <!-- Recent photos -->
    <div class="photos-strip">
      <div class="photos-row">
        <div class="photo-cell" style="background-image: linear-gradient(135deg, #2a3a52, #1a1f2e);">
          <span class="label">2 16:18<br>테스트<br>2 16:18<br>코바늘 입문</span>
        </div>
        <div class="photo-cell" style="background: linear-gradient(180deg, #d4d6c8 0%, #b5b8a3 100%);"></div>
        <div class="photo-cell" style="background: linear-gradient(135deg, #7da659, #4a6b3f);"></div>
      </div>
      <div class="view-all">전체 보기 (11장) <span class="chevron">›</span></div>
    </div>

    <!-- Favorite section -->
    <div class="section-header">
      <span class="star-icon">★</span>
      <span class="title">즐겨찾기</span>
      <span class="count">1</span>
    </div>
    <div class="card-list">
      <div class="row">
        <span>보그 코바늘 입문</span>
        <span class="chevron">›</span>
      </div>
    </div>

    <!-- Ongoing section -->
    <div class="section-header">
      <span class="status-dot ongoing"></span>
      <span class="title">진행 중</span>
      <span class="count">4</span>
      <span class="right-link">전체보기</span>
    </div>
    <div class="card-list">
      <div class="row"><span>보그 코바늘 입문</span><span class="chevron">›</span></div>
      <div class="row"><span>테스트</span><span class="chevron">›</span></div>
      <div class="row"><span>아빠 양말</span><span class="chevron">›</span></div>
      <div class="row"><span>헤리엇스웨터</span><span class="chevron">›</span></div>
    </div>

    <!-- All projects + Create -->
    <div style="height: 18px;"></div>
    <div class="card-list">
      <div class="row">
        <span class="row-icon">☰</span>
        <span class="label-strong">전체 프로젝트</span>
        <span class="right-count">8개</span>
        <span class="chevron" style="margin-left:8px;">›</span>
      </div>
      <div class="row">
        <span class="row-icon">⊕</span>
        <span class="label-strong" style="color: var(--pink);">프로젝트 만들기</span>
      </div>
    </div>

    <div style="height: 12px;"></div>
  </div>

  <!-- Ad Banner -->
  <div class="ad-banner">
    <div class="ad-thumb"></div>
    <div class="ad-text">Nice job!<br><span style="opacity:0.7;">Tap to install our test ad.</span></div>
    <span class="test-pill">Test mode</span>
    <div class="ad-logo">a</div>
  </div>

  <!-- Tab bar -->
  <div class="tab-bar">
    <div class="tab active">
      <span class="icon">⌂</span>
      <span>home</span>
    </div>
    <div class="tab">
      <span class="icon">▣</span>
      <span>camera</span>
    </div>
    <div class="tab">
      <span class="icon">⚙</span>
      <span>settings</span>
    </div>
  </div>

</div>
</body>
</html>
